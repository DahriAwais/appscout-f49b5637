<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>AppScout</title>
    <style>
      :root {
        --purple: #7c3aed;
        --ink: #1e293b;
        --line: #f1f5f9;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #fff;
        color: var(--ink);
        font:
          600 18px 'Segoe UI',
          system-ui,
          sans-serif;
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        animation: logo-in 450ms ease-out both;
      }
      p {
        margin: 0;
        animation: fade-in 350ms 450ms ease-out both;
      }
      .track {
        width: 150px;
        height: 2px;
        overflow: hidden;
        background: var(--line);
      }
      .progress {
        height: 100%;
        background: var(--purple);
        transform-origin: left;
        animation: progress 1250ms 500ms ease-out both;
      }
      @keyframes logo-in {
        from {
          transform: scale(0.75);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes progress {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        img,
        p,
        .progress {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img src="./startup-logo.svg" width="88" height="88" alt="AppScout" />
    <p>Discover app potential.</p>
    <div class="track" role="status" aria-label="Opening AppScout">
      <div class="progress"></div>
    </div>
  </body>
</html>
