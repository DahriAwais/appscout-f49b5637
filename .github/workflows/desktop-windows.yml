name: Windows desktop smoke build
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Allow workspace file symlinks
        shell: pwsh
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core tests and desktop types
        run: npm run desktop:check
      - name: Build unsigned installer
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AppScout-Windows-unsigned
          path: apps/desktop/release/*.exe
